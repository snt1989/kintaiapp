<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a56db">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤怠管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>直接入力 | 勤怠管理システム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/pwa.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>直接入力</h1>
    <div class="user-info">
      <a class="help-link" href="/help.html">使い方</a>
      <span id="userName"></span>
      <button class="logout-btn" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="manual-today" id="workTime">本日の勤務時間: --時間--分</div>
      <h2 style="margin-top:16px;font-size:16px;">時間を直接入力して登録</h2>

      <form id="manualForm" novalidate>
        <label for="date">日付(必須)</label>
        <input type="date" id="date" required>

        <div class="time-grid">
          <div>
            <label for="clockIn">出勤(必須)</label>
            <input type="time" id="clockIn" required>
          </div>
          <div>
            <label for="clockOut">退勤(必須)</label>
            <input type="time" id="clockOut" required>
          </div>
          <div>
            <label for="breakStart">休憩開始(任意)</label>
            <input type="time" id="breakStart">
          </div>
          <div>
            <label for="breakEnd">休憩終了(任意)</label>
            <input type="time" id="breakEnd">
          </div>
        </div>

        <label for="siteDivision">現場の該当事業部(必須)</label>
        <select id="siteDivision" required>
          <option value="">選択してください</option>
        </select>

        <label for="siteName">現場名(任意)</label>
        <input type="text" id="siteName" placeholder="例: 〇〇工場 A棟" autocomplete="off">

        <label for="remarks">備考(任意)</label>
        <input type="text" id="remarks" autocomplete="off">

        <button type="submit" class="btn" id="submitBtn">この内容で登録する</button>
        <div id="resultMsg"></div>
      </form>
    </div>
  </main>

  <nav class="tabbar">
    <a href="/manual.html" class="active"><span class="tab-icon">✍️</span>直接入力</a>
    <a href="/clock.html"><span class="tab-icon">⏱️</span>打刻入力</a>
  </nav>
</div>

<script src="/js/demo-mock.js"></script>
<script src="/js/api.js"></script>
<script>
Api.requireLogin();
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const employee = Api.getEmployee() || {};
document.getElementById('userName').textContent = `${employee.name} (${employee.employee_code})`;
document.getElementById('logoutBtn').addEventListener('click', () => {
  Api.clearSession();
  location.href = '/index.html';
});

const $ = (id) => document.getElementById(id);


// 日付の初期値は今日(JST)。未来日は選べない。
function jstToday() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}
$('date').value = jstToday();
$('date').max = jstToday();

// 事業部・現場名は「打刻入力」画面と同じ保存値を初期表示に使う
const SITE_NAME_KEY = 'sanoh_attendance_site_name';
const SITE_DIVISION_KEY = 'sanoh_attendance_site_division';
$('siteName').value = localStorage.getItem(SITE_NAME_KEY) || '';

(async () => {
  try {
    const data = await Api.request('/auth/divisions');
    const preferred = localStorage.getItem(SITE_DIVISION_KEY) || employee.division || '';
    $('siteDivision').innerHTML = '<option value="">選択してください</option>' +
      data.divisions.map((d) => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('');
    if (preferred && data.divisions.some((d) => d.name === preferred)) $('siteDivision').value = preferred;
  } catch (err) {
    console.error(err);
  }
})();

// 本日の勤務時間: 入力した出勤・退勤・休憩の時刻から計算する(休憩は開始・終了が揃っている場合のみ差し引く)
function toMin(t) {
  if (!/^\d{2}:\d{2}$/.test(t)) return null;
  return parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3), 10);
}
function updateSummary() {
  const inM = toMin($('clockIn').value);
  const outM = toMin($('clockOut').value);
  const bs = toMin($('breakStart').value);
  const be = toMin($('breakEnd').value);
  const el = $('workTime');
  if (inM === null || outM === null || outM <= inM) {
    el.textContent = '本日の勤務時間: --時間--分';
    return;
  }
  let worked = outM - inM;
  if (bs !== null && be !== null && be > bs) worked -= be - bs;
  worked = Math.max(0, worked);
  el.textContent = `本日の勤務時間: ${Math.floor(worked / 60)}時間${worked % 60}分`;
}
['clockIn', 'clockOut', 'breakStart', 'breakEnd'].forEach((id) => $(id).addEventListener('input', updateSummary));

function showResult(text, ok) {
  $('resultMsg').innerHTML = `<div class="${ok ? 'success-msg' : 'error-msg'}">${text}</div>`;
}

$('manualForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('resultMsg').innerHTML = '';
  const body = {
    date: $('date').value,
    clock_in: $('clockIn').value,
    clock_out: $('clockOut').value,
    break_start: $('breakStart').value,
    break_end: $('breakEnd').value,
    site_division: $('siteDivision').value,
    note: $('siteName').value.trim(),
    remarks: $('remarks').value.trim(),
  };
  $('submitBtn').disabled = true;
  try {
    await Api.request('/attendance/manual', { method: 'POST', body });
    localStorage.setItem(SITE_DIVISION_KEY, body.site_division);
    localStorage.setItem(SITE_NAME_KEY, body.note);
    showResult(`${body.date} の勤務時間を登録しました。`, true);
    ['clockIn', 'clockOut', 'breakStart', 'breakEnd', 'remarks'].forEach((id) => { $(id).value = ''; });
    updateSummary();
  } catch (err) {
    showResult(err.message, false);
  } finally {
    $('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
