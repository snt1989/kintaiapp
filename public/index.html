<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a56db">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤怠管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>勤怠管理システム</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/pwa.js" defer></script>
</head>
<body>
<div class="center-card">
  <div class="card login-card">
    <h1>勤怠管理システム</h1>
    <div class="subtitle">ログイン</div>

    <form id="loginForm">
      <label for="employee_code">社員番号</label>
      <input type="text" id="employee_code" inputmode="text" autocomplete="username" required autofocus>

      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn" id="loginBtn">ログイン</button>
    </form>

    <div id="errorBox" class="error-msg hidden"></div>

    <div id="installBox" hidden style="text-align:center;margin-top:18px;">
      <button type="button" class="btn secondary small" id="installBtn">アプリとしてインストール</button>
    </div>
    <div id="iosHint" hidden style="margin-top:18px;font-size:12.5px;line-height:1.7;color:var(--color-text-muted);text-align:center;">
      iPhone・iPad では、Safari の共有ボタン(□↑)から「ホーム画面に追加」を選ぶと、アプリとして使えます。
    </div>
    <div style="text-align:center;margin-top:18px;">
      <a href="/register.html" style="font-size:13px;color:var(--color-text-muted);">初めての方はこちら(社員登録)</a>
    </div>
    <div style="text-align:center;margin-top:8px;">
      <a href="/help.html" style="font-size:13px;color:var(--color-text-muted);">使い方(Q&amp;A)</a>
    </div>
    <div style="text-align:center;margin-top:8px;">
      <a href="/setup.html" style="font-size:13px;color:var(--color-text-muted);">管理者アカウントの作成・セットアップはこちら</a>
    </div>
  </div>
</div>

<script src="/js/demo-mock.js"></script>
<script src="/js/api.js"></script>
<script>
  // 既にログイン済みならそれぞれのトップ画面へ
  const existing = Api.getEmployee();
  if (Api.getToken() && existing) {
    location.href = existing.role === 'admin' ? '/admin.html' : '/manual.html';
  }

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');
    loginBtn.disabled = true;
    loginBtn.textContent = 'ログイン中...';

    try {
      const employee_code = document.getElementById('employee_code').value.trim();
      const password = document.getElementById('password').value;
      const data = await Api.request('/auth/login', {
        method: 'POST',
        body: { employee_code, password },
      });
      Api.setSession(data.token, data.employee);
      location.href = data.employee.role === 'admin' ? '/admin.html' : '/manual.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('hidden');
      loginBtn.disabled = false;
      loginBtn.textContent = 'ログイン';
    }
  });
</script>
</body>
</html>
