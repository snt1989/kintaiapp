<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>社員情報の編集 | 勤怠管理システム</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .reg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .reg-grid > div { min-width: 0; }
  .reg-section { font-size: 14px; font-weight: 700; margin: 22px 0 4px; padding-top: 14px; border-top: 1px solid var(--color-border, #e2e5ea); }
  .reg-section:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .reg-hint { font-size: 12px; margin: 4px 0 0; }
  .reg-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .reg-actions .btn { margin-top: 0; width: auto; padding-inline: 22px; text-decoration: none; }
  @media (max-width: 560px) { .reg-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app wide">
  <header class="topbar">
    <h1>社員情報の編集</h1>
    <div class="user-info">
      <span id="userName"></span>
      <button class="logout-btn" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <nav class="admin-subnav">
    <a href="/admin.html">勤怠ログ</a>
    <a href="/employees.html">社員管理</a>
    <a href="/master.html">マスタ管理</a>
    <a href="/payroll.html" class="active">給与計算</a>
  </nav>

  <main>
    <div class="card">
      <label for="empSelect">編集する社員</label>
      <select id="empSelect"><option value="">読み込み中...</option></select>
    </div>

    <div class="card" id="editCard" hidden>
      <form id="editForm" novalidate>
        <div class="reg-section">基本情報</div>
        <div class="reg-grid">
          <div>
            <label for="empCode">社員番号</label>
            <input type="text" id="empCode" autocomplete="off" required>
          </div>
          <div>
            <label for="empRole">権限</label>
            <select id="empRole">
              <option value="employee">一般社員</option>
              <option value="contractor">委託職員</option>
              <option value="partner">協力会社</option>
              <option value="admin">管理者</option>
            </select>
          </div>
          <div>
            <label for="empLastName">姓</label>
            <input type="text" id="empLastName" autocomplete="off" required>
          </div>
          <div>
            <label for="empFirstName">名</label>
            <input type="text" id="empFirstName" autocomplete="off" required>
          </div>
          <div>
            <label for="empDivision">事業部</label>
            <select id="empDivision"><option value="">未設定</option></select>
          </div>
          <div>
            <label for="empActive">状態</label>
            <select id="empActive">
              <option value="1">有効</option>
              <option value="0">無効</option>
            </select>
          </div>
          <div>
            <label for="empPassword">新しいパスワード</label>
            <input type="text" id="empPassword" autocomplete="off" placeholder="変更しないときは空欄">
            <p class="text-muted reg-hint">変更する場合だけ、3文字以上で入力します。</p>
          </div>
        </div>

        <div class="reg-section">保険の加入状況</div>
        <div class="reg-grid">
          <div>
            <label for="empSocial">社会保険(健康保険・厚生年金保険)</label>
            <select id="empSocial"><option value="1">加入</option><option value="0">未加入</option></select>
          </div>
          <div>
            <label for="empLabor">労働保険(雇用保険)</label>
            <select id="empLabor"><option value="1">加入</option><option value="0">未加入</option></select>
          </div>
        </div>
        <p class="text-muted reg-hint">保険料は、給与明細の編集ページで月ごとに入力します。未加入の社員に保険料を入力すると、明細の編集ページに注意を表示します。</p>

        <div class="reg-section">給与・所得税</div>
        <div class="reg-grid">
          <div>
            <label for="empWage">時給(円)</label>
            <input type="number" id="empWage" min="0" max="999999" step="10" inputmode="numeric" placeholder="未設定">
          </div>
          <div>
            <label for="empTaxTable">税区分</label>
            <select id="empTaxTable">
              <option value="kou">甲欄(扶養控除等申告書を提出)</option>
              <option value="otsu">乙欄(提出なし・自動計算の対象外)</option>
            </select>
          </div>
          <div>
            <label for="empDependents">扶養親族等の数(人)</label>
            <input type="number" id="empDependents" min="0" max="20" step="1" value="0" inputmode="numeric">
            <p class="text-muted reg-hint">控除対象配偶者を含めた人数です。</p>
          </div>
        </div>
        <p class="text-muted reg-hint" id="taxNote"></p>

        <div id="editMsg" style="margin-top:14px;"></div>
        <div class="reg-actions">
          <button class="btn" id="saveBtn" type="submit">保存する</button>
          <a class="btn secondary" href="/payroll.html">給与計算に戻る</a>
        </div>
      </form>
    </div>
    <div id="pageMsg"></div>
  </main>
</div>

<script src="/js/demo-mock.js"></script>
<script src="/js/api.js"></script>
<script>
Api.requireAdmin();
const employee = Api.getEmployee();
document.getElementById('userName').textContent = `${employee.name} (管理者)`;
document.getElementById('logoutBtn').addEventListener('click', () => {
  Api.clearSession();
  location.href = '/index.html';
});

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let employees = [];

function syncTaxFields() {
  const otsu = $('empTaxTable').value === 'otsu';
  $('empDependents').disabled = otsu;
  $('taxNote').textContent = otsu
    ? '乙欄は自動計算の対象外です。給与明細の編集ページで所得税の金額を入力してください。'
    : '所得税は、給与計算のときに自動で計算します。令和8年分の源泉徴収税額表(月額表・甲欄)の算式を使い、支給額から社会保険料と非課税の通勤手当を除いた金額が基準です。';
}
$('empTaxTable').addEventListener('change', syncTaxFields);

function fillForm(id) {
  $('editMsg').innerHTML = '';
  const e = employees.find((x) => String(x.id) === String(id));
  $('editCard').hidden = !e;
  if (!e) return;
  $('empCode').value = e.employee_code;
  $('empLastName').value = e.last_name || '';
  $('empFirstName').value = e.first_name || '';
  $('empRole').value = e.role;
  $('empDivision').value = e.division || '';
  $('empActive').value = e.active ? '1' : '0';
  $('empPassword').value = '';
  $('empSocial').value = e.social_insurance ? '1' : '0';
  $('empLabor').value = e.labor_insurance ? '1' : '0';
  $('empWage').value = e.hourly_wage == null ? '' : e.hourly_wage;
  $('empTaxTable').value = e.tax_table === 'otsu' ? 'otsu' : 'kou';
  $('empDependents').value = e.dependents || 0;
  syncTaxFields();
  history.replaceState(null, '', `?id=${encodeURIComponent(e.id)}`);
}

$('empSelect').addEventListener('change', () => fillForm($('empSelect').value));

$('editForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('editMsg').innerHTML = '';
  const id = $('empSelect').value;
  const body = {
    employee_code: $('empCode').value.trim(),
    last_name: $('empLastName').value.trim(),
    first_name: $('empFirstName').value.trim(),
    role: $('empRole').value,
    division: $('empDivision').value,
    active: $('empActive').value === '1' ? 1 : 0,
    social_insurance: $('empSocial').value,
    labor_insurance: $('empLabor').value,
    hourly_wage: $('empWage').value.trim(),
    tax_table: $('empTaxTable').value,
    dependents: $('empTaxTable').value === 'otsu' ? '0' : $('empDependents').value.trim(),
  };
  if ($('empPassword').value) body.new_password = $('empPassword').value;
  if (!body.employee_code || !body.last_name || !body.first_name) {
    $('editMsg').innerHTML = '<div class="error-msg">社員番号・姓・名を入力してください。</div>';
    return;
  }
  $('saveBtn').disabled = true;
  try {
    const res = await Api.request(`/admin/employees/${encodeURIComponent(id)}`, { method: 'PUT', body });
    const saved = res.employee;
    const i = employees.findIndex((x) => String(x.id) === String(id));
    if (i !== -1) employees[i] = saved;
    $('empSelect').options[$('empSelect').selectedIndex].textContent = `${saved.employee_code} ${saved.name}${saved.active ? '' : '(無効)'}`;
    $('empPassword').value = '';
    $('editMsg').innerHTML = `<div class="success-msg">${esc(saved.name)}さんの社員情報を保存しました。</div>`;
  } catch (err) {
    $('editMsg').innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
  } finally {
    $('saveBtn').disabled = false;
  }
});

(async () => {
  try {
    const [emps, divs] = await Promise.all([Api.request('/admin/employees'), Api.request('/admin/divisions')]);
    employees = emps.employees;
    $('empDivision').innerHTML = '<option value="">未設定</option>' +
      divs.divisions.map((d) => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('');
    $('empSelect').innerHTML = '<option value="">選んでください</option>' +
      employees.map((e) => `<option value="${e.id}">${esc(e.employee_code)} ${esc(e.name)}${e.active ? '' : '(無効)'}</option>`).join('');
    const wanted = new URLSearchParams(location.search).get('id');
    if (wanted && employees.some((e) => String(e.id) === wanted)) {
      $('empSelect').value = wanted;
      fillForm(wanted);
    }
  } catch (err) {
    $('pageMsg').innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
